<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card" data-table-id="AuthTable" autocomplete="off">
    <div class="layui-card-body padding-left-40">
        <label class="layui-form-item relative block">
            <span class="help-label"><b>{:lang('角色名称')}</b>Auth Name</span>
            <input maxlength="100" class="layui-input" name="title" value='{$vo.title|default=""}' required vali-name="{:lang('角色名称')}" placeholder="{:lang('请输入角色名称')}">
        </label>
        <label class="layui-form-item relative block">
            <span class="help-label"><b>{:lang('备注说明')}</b>Remark</span>
            <textarea placeholder="{:lang('请输入备注说明')}" maxlength="200" class="layui-textarea" name="desc">{$vo.desc|default=""}</textarea>
        </label>
    </div>
    <div class="hr-line-dashed"></div>
    {notempty name='vo.id'}<input type='hidden' value='{$vo.id}' name='id'>{/notempty}
    <div class="layui-form-item text-center">
        <button class="layui-btn" type='submit'>{:lang('保存数据')}</button>
        <button class="layui-btn layui-btn-danger" type='button' data-confirm="{:lang('确定要取消编辑吗？')}" data-close>{:lang('取消编辑')}</button>
    </div>
</form>
