{extend name='table'}

{block name="button"}
<!--{if auth("add")}-->
<button data-modal='{:sysuri("add")}' data-title="{:lang('添加用户')}" class='layui-btn layui-btn-sm layui-btn-primary'>{:lang('添加用户')}</button>
<!--{/if}-->
<!--{if auth("remove")}-->
<a data-confirm="{:lang('确定删除这些账号吗？')}" data-table-id="UserTable" data-action='{:sysuri("remove")}' data-rule="id#{id}" class='layui-btn layui-btn-sm layui-btn-primary'>{:lang('批量删除')}</a>
<!--{/if}-->
{/block}

{block name="content"}
{include file='console/user/index_search'}
<table id="UserTable" data-url="{:sysuri('index')}" data-target-search="form.form-search"></table>
<script>
    $(function () {
        $('#UserTable').layTable({
            even: true, height: 'full',
            sort: {field: 'create_at', type: 'desc'},
            cols: [[
                {checkbox: true, fixed: true},
                {field: 'username', title: '{:lang("登录账号")}', minWidth: 100, align: 'center'},
                {field: 'nickname', title: '{:lang("用户名称")}', minWidth: 100, align: 'center', templet: '<div>{{d.nickname||"-"}}</div>'},
                {field: 'is_super', title: '{:lang("身份")}', align: 'center', minWidth: 90, templet: function (d) {
                    return d.is_super ? '<b class="color-red">{:lang("站点超管")}</b>' : '-';
                }},
                {field: 'status', title: '{:lang("使用状态")}', align: 'center', minWidth: 110, templet: '#StatusSwitchTpl'},
                {field: 'login_num', title: '{:lang("登录次数")}', align: 'center', minWidth: 100},
                {field: 'login_at', title: '{:lang("最后登录")}', align: 'center', minWidth: 170},
                {toolbar: '#toolbar', title: '{:lang("操作面板")}', align: 'center', minWidth: 220, fixed: 'right'}
            ]]
        });
        layui.form.on('switch(StatusSwitch)', function (obj) {
            var data = {id: obj.value, status: obj.elem.checked > 0 ? 1 : 0};
            $.form.load("{:sysuri('state')}", data, 'post', function (ret) {
                $('#UserTable').trigger('reload');
                return false;
            }, false);
        });
    });
</script>

<script type="text/html" id="StatusSwitchTpl">
    <!--{if auth("state")}-->
    <input type="checkbox" value="{{d.id}}" lay-skin="switch" lay-text="{:lang('已激活')}|{:lang('已禁用')}" lay-filter="StatusSwitch" {{-d.status>0?'checked':''}}>
    <!--{else}-->
    {{-d.status ? '<b class="color-green">{:lang("已激活")}</b>' : '<b class="color-red">{:lang("已禁用")}</b>'}}
    <!--{/if}-->
</script>

<script type="text/html" id="toolbar">
    <!--{if auth("edit")}-->
    <a class="layui-btn layui-btn-sm" data-title="{:lang('编辑用户')}" data-modal='{:sysuri("edit")}?id={{d.id}}'>{:lang('编 辑')}</a>
    <!--{/if}-->
    <!--{if auth("pass")}-->
    <a class="layui-btn layui-btn-sm layui-btn-normal" data-title="{:lang('设置密码')}" data-modal='{:sysuri("pass")}?id={{d.id}}'>{:lang('密 码')}</a>
    <!--{/if}-->
    {{# if(!d.is_super){ }}
    <!--{if auth("remove")}-->
    <a class="layui-btn layui-btn-sm layui-btn-danger" data-confirm="{:lang('确定要删除吗？')}" data-action="{:sysuri('remove')}" data-value="id#{{d.id}}">{:lang('删 除')}</a>
    <!--{/if}-->
    {{# } }}
</script>
{/block}
