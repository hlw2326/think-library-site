<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card" data-table-id="UserTable" autocomplete="off">
    <div class="layui-card-body padding-left-40">
        <label class="layui-form-item relative block">
            <span class="help-label"><b>{:lang('登录账号')}</b>Username</span>
            <input disabled value='{$vo.username|default=""}' class="layui-input think-bg-gray">
        </label>
        <label class="layui-form-item relative block">
            <span class="help-label"><b>{:lang('新的登录密码')}</b>New Password</span>
            <input type="password" autocomplete="new-password" name="password" maxlength="32" pattern="^\S{8,32}$" required vali-name="{:lang('登录密码')}" placeholder="{:lang('请输入新的登录密码')}" class="layui-input">
            <span class="color-desc">{:lang('密码长度为 8 到 32 位，不能包含空格。')}</span>
        </label>
        <label class="layui-form-item relative block">
            <span class="help-label"><b>{:lang('重复登录密码')}</b>Repeat Password</span>
            <input type="password" autocomplete="new-password" name="repassword" maxlength="32" pattern="^\S{8,32}$" required vali-name="{:lang('重复密码')}" placeholder="{:lang('请重复输入登录密码')}" class="layui-input">
        </label>
    </div>
    <div class="hr-line-dashed"></div>
    {notempty name='vo.id'}<input type='hidden' value='{$vo.id}' name='id'>{/notempty}
    <div class="layui-form-item text-center">
        <button class="layui-btn" type='submit'>{:lang('保存数据')}</button>
        <button class="layui-btn layui-btn-danger" type='button' data-confirm="{:lang('确定要取消编辑吗？')}" data-close>{:lang('取消编辑')}</button>
    </div>
</form>
