<div class="layui-header">
    <ul class="layui-nav layui-layout-left">
        <li class="layui-nav-item" lay-unselect>
            <a class="text-center" data-target-menu-type>
                <i class="layui-icon layui-icon-spread-left"></i>
            </a>
        </li>
        <li class="layui-nav-item" lay-unselect>
            <a class="layui-logo-hide layui-elip" href="{:sysuri('site/console.index/index')}" title="{$site.name|default=''}">
                <span class="headimg headimg-no headimg-xs" data-lazy-src="{$site.logo|default=''}"></span>
            </a>
        </li>
        {foreach $menus as $one}
        <li class="layui-nav-item">
            <a data-menu-node="m-{$one.id|default=''}" data-open="{$one.url}"><span>{$one.title|default=''}</span></a>
        </li>
        {/foreach}
    </ul>
    <ul class="layui-nav layui-layout-right">
        <li lay-unselect class="layui-nav-item"><a data-reload><i class="layui-icon layui-icon-refresh-3"></i></a></li>
        <li class="layui-nav-item">
            <dl class="layui-nav-child">
                <dd lay-unselect><a data-load="{:sysuri('site/passport/out')}" data-confirm="{:lang('确定要退出登录吗？')}"><i class="layui-icon layui-icon-release"></i> {:lang('退出登录')}</a></dd>
            </dl>
            <a class="layui-elip">
                <span class="headimg" data-lazy-src="{:htmlentities($user.headimg ?? '')}"></span>
                <span>{:htmlentities($user.nickname ?? $user.username ?? '')}</span>
            </a>
        </li>
    </ul>
</div>
